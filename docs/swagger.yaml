info:
  contact: {}
paths:
  /api/cart:
    get:
      description: Retrieve the authenticated user's cart items with subtotal per
        item and grand total
      produces:
      - application/json
      responses:
        "200":
          description: Cart items
          schema:
            allOf:
            - $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
            - properties:
                data:
                  properties:
                    grand_total:
                      type: number
                    items:
                      items:
                        $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_internal_service.CartItemResponse'
                      type: array
                  type: object
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
      security:
      - BearerAuth: []
      summary: Get user cart
      tags:
      - Cart
    post:
      consumes:
      - application/json
      description: Add a product variant to cart or increment quantity if it already
        exists
      parameters:
      - description: Variant and quantity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.AddToCartRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Item added
          schema:
            allOf:
            - $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Validation error or variant not found
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
      security:
      - BearerAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /api/cart/{id}:
    delete:
      description: Delete a specific item from the user's cart
      parameters:
      - description: Cart item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Item removed
          schema:
            allOf:
            - $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Invalid ID or item not found
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
      security:
      - BearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    put:
      consumes:
      - application/json
      description: Update the exact quantity of a specific cart item
      parameters:
      - description: Cart item ID
        in: path
        name: id
        required: true
        type: integer
      - description: New quantity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Cart updated
          schema:
            allOf:
            - $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Validation error or item not found
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
      security:
      - BearerAuth: []
      summary: Update cart item quantity
      tags:
      - Cart
  /api/categories:
    get:
      description: Retrieve a list of all product categories
      produces:
      - application/json
      responses:
        "200":
          description: List of categories
          schema:
            allOf:
            - $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_internal_entity.Category'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
      tags:
      - Catalog
  /api/login:
    post:
      consumes:
      - application/json
      description: Authenticate user credentials and return access and refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
            - properties:
                data:
                  properties:
                    access_token:
                      type: string
                    refresh_token:
                      type: string
                  type: object
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
      summary: User login
      tags:
      - Auth
  /api/logistics:
    get:
      description: Retrieve all logistics providers and their shipping service options
        with pricing
      produces:
      - application/json
      responses:
        "200":
          description: Logistic list
          schema:
            allOf:
            - $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_internal_entity.Logistic'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
      summary: Get available logistics
      tags:
      - Catalog
  /api/orders:
    get:
      description: Retrieve the authenticated user's order history
      produces:
      - application/json
      responses:
        "200":
          description: Order list
          schema:
            allOf:
            - $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_internal_entity.Order'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
      security:
      - BearerAuth: []
      summary: Get order history
      tags:
      - Order
  /api/orders/{id}:
    get:
      description: Retrieve a specific order and its associated items
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order detail
          schema:
            allOf:
            - $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_internal_entity.Order'
              type: object
        "400":
          description: Invalid order ID
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
      security:
      - BearerAuth: []
      summary: Get order detail
      tags:
      - Order
  /api/orders/{id}/cancel:
    post:
      description: Cancel a pending order and restock all variants atomically
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order cancelled
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
        "403":
          description: Order cannot be cancelled — not pending
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
      security:
      - BearerAuth: []
      summary: Cancel order
      tags:
      - Order
  /api/orders/{id}/pay:
    post:
      description: Create a Midtrans Snap transaction for a pending order and return
        the payment token and URL
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Payment initiated
          schema:
            allOf:
            - $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
            - properties:
                data:
                  properties:
                    payment_url:
                      type: string
                    snap_token:
                      type: string
                  type: object
              type: object
        "400":
          description: Invalid order ID
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_yosmisyael_cloudmart-web-service_pkg_response.WebResponse'
        "404":
          description: Order not found
